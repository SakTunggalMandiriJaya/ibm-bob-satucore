name: SATUCORE recovery application checks

on:
  push:
    branches:
      - "feature/transaction-monitor-2026-11-28"
  pull_request:
    branches:
      - "feature/transaction-monitor-2026-11-28"

jobs:
  app-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satucore-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: satucore-recovery/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
